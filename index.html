<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pause & Save - Reverse Shopping Cart</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Pause & Save</h1>
      <p>Trade work hours instead of impulsive spending.</p>
    </header>

    <section class="stats-bar">
      <div class="stat-card">
        <span>Hourly Wage</span>
        <div class="stat-value">$<span id="wageDisplay">15.00</span></div>
        <button onclick="setWagePrompt()" class="btn-subtle">Edit Wage</button>
      </div>
      <div class="stat-card highlight">
        <span>Total Money Saved</span>
        <div class="stat-value">$<span id="totalSavedDisplay">0.00</span></div>
      </div>
    </section>

    <section class="card">
      <h2>Add Impulse Item</h2>
      <form id="itemForm">
        <div class="form-group">
          <label for="itemName">Item Name</label>
          <input type="text" id="itemName" placeholder="e.g. Wireless Headphones" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="itemPrice">Price ($)</label>
            <input type="number" id="itemPrice" min="1" step="0.01" placeholder="120" required />
          </div>
          <div class="form-group">
            <label for="itemDays">Cooling Period</label>
            <select id="itemDays">
              <option value="7">7 Days</option>
              <option value="14" selected>14 Days</option>
              <option value="30">30 Days</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn-primary">Lock Item in Cooldown</button>
      </form>
    </section>

    <section>
      <h2>Cooling-Off List</h2>
      <div id="itemsContainer" class="items-grid"></div>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
